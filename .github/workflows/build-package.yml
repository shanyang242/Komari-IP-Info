name: Build and publish plugin package

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Build package
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Komari-IP-Info-package
          path: dist/komari-ip-info-v*.zip

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -Encoding UTF8 -LiteralPath "komari-plugin.json" | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=Komari IP Info $tag" >> $env:GITHUB_OUTPUT

      - name: Move version tag to this commit
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force $tag $env:GITHUB_SHA
          git push origin ("refs/tags/" + $tag) --force

      - name: Publish rolling GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body_path: .github/release-notes/v0.0.1.md
          files: dist/komari-ip-info-v*.zip
          make_latest: true
          overwrite_files: true
